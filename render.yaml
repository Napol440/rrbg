# One-click rooms hosting on Render's free tier (app + wss rooms, one service).
# Dashboard alternative: New → Web Service → select this repo,
#   Build: npm ci && npm run build | Start: npm start  (PORT is auto-provided).
services:
  - type: web
    name: rrbg
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
